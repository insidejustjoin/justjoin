# Cloud Build configuration for justjoin
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/justjoin:latest', '-f', 'Dockerfile.gcp', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/justjoin:latest']
images:
  - 'gcr.io/$PROJECT_ID/justjoin:latest' 