NODE_ENV: "production"
DATABASE_URL: "postgresql://postgres:justjoin2024@/justjoin?host=/cloudsql/justjoin-platform:asia-northeast1:justjoin-enterprise"
GOOGLE_CLOUD_PROJECT_ID: "justjoin-platform"
JWT_SECRET: "justjoin-interview-jwt-secret-2024"
SESSION_SECRET: "justjoin-interview-session-secret-2024"
CORS_ORIGIN: "https://interview.justjoin.jp,https://justjoin.jp"
MAX_INTERVIEW_DURATION: "1800"
MAX_QUESTION_TIMEOUT: "600"
MAX_ANSWER_LENGTH: "1000"
DEFAULT_LANGUAGE: "ja"
# VOICEVOX Engine URL（高品質な日本語音声合成用）
# 本番環境ではCloud RunのVOICEVOXサービスURLを設定
# 例: https://voicevox-engine-788053304941.asia-northeast1.run.app
# ローカル開発時: http://localhost:50021
VOICEVOX_URL: "https://voicevox-engine-788053304941.asia-northeast1.run.app"
# OpenAI TTS API（フォールバック用）
OPENAI_API_KEY: "your-openai-api-key-here"
# Google Cloud Text-to-Speech APIはサービスアカウントの認証情報を自動的に使用します
# Cloud Runでは追加の認証情報設定は不要です 